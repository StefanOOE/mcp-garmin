[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-garmin"
version = "0.1.0"
description = "MCP server for Garmin Connect data"
authors = [{name = "Stefan Strauß-Haslinglehner", email = "garmin.com.ploy864@passmail.net"}]
license = "MIT"
readme = "README.md"
python_requires = ">=3.9"
dependencies = [
    "mcp>=0.1.0",
    "garth>=0.1.0",
    "pydantic>=2.0.0",
    "requests>=2.25.0",
]

[project.scripts]
mcp-garmin-login = "mcp_garmin.login:main"

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.10.0",
    "ruff>=0.0.284",
    "black>=22.0.0",
    "mypy>=0.900",
]

[project.urls]
Homepage = "https://github.com/yourusername/mcp-garmin"
Repository = "https://github.com/yourusername/mcp-garmin"