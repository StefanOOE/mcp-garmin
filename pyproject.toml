[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-garmin"
version = "0.1.0"
description = "MCP server exposing Garmin Connect data as fine-grained tools (local, token-based)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "StefanOOE" }]
keywords = ["mcp", "model-context-protocol", "garmin", "fitness", "health"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["mcp>=2.0", "garth-ng==2.0.0a1", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mcp-garmin = "mcp_garmin.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_garmin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]