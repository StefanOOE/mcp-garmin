# Enable flake8-bugbear (`B`) rules
extend-ignore = ["B008", "E501", "F821", "F403", "UP035", "UP006", "RUF043", "B004"]
line-length = 120
target-version = "py39"

[lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]

[lint.per-file-ignores]
"tests/*" = ["S101", "E501"]  # Allow asserts in tests

[format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"